name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - laravel: '12'
            testbench: '^10.0'
            php: '8.2'
          - laravel: '12'
            testbench: '^10.0'
            php: '8.5'
          - laravel: '13'
            testbench: '^11.0'
            php: '8.3'
          - laravel: '13'
            testbench: '^11.0'
            php: '8.5'
    name: Laravel ${{ matrix.laravel }} / PHP ${{ matrix.php }}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, dom, fileinfo, curl
          coverage: none
          tools: composer:v2
      - name: Resolve dependencies
        run: |
          composer require --no-update "illuminate/support:^${{ matrix.laravel }}.0"
          composer require --dev --no-update "orchestra/testbench:${{ matrix.testbench }}"
          composer update --prefer-dist --no-interaction
      - run: composer validate --strict
      - run: composer dump-autoload --optimize --strict-psr
      - run: composer test
      - run: composer audit
